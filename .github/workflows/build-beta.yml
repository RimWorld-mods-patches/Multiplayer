name: Build beta

env:
  SLN_PATH: Source/

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - steam-send-rate-test
    paths-ignore:
      - 'README.md'

jobs:
  build:
    name: Build beta
    runs-on: ubuntu-latest
    env:
        GH_TOKEN: ${{ github.token }}
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
      
    - name: Identify commit
      run: |
        echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
        {
          echo "COMMIT_SUBJECT<<COMMIT_SUBJECT_EOF"
          git log -1 --pretty=%s
          echo "COMMIT_SUBJECT_EOF"
        } >> "$GITHUB_ENV"

    - name: Setup Dotnet
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.x
      
    - name: Install Mod Dependencies
      run: dotnet restore ${{ env.SLN_PATH }}

    - name: Build Mod
      run: dotnet build ${{ env.SLN_PATH }} --configuration Release --no-restore

    - name: Publish Server (Windows)
      run: dotnet publish ${{ env.SLN_PATH }}Server/Server.csproj --configuration Release --runtime win-x64 --self-contained false -p:UseAppHost=true -o output/Server/Windows

    - name: Publish Server (Linux)
      run: dotnet publish ${{ env.SLN_PATH }}Server/Server.csproj --configuration Release --runtime linux-x64 --self-contained false -p:UseAppHost=true -o output/Server/Linux

    - name: Add Server Launchers
      run: |
        cat > output/Server/Linux/Server.sh <<'EOF'
        #!/usr/bin/env bash
        set -euo pipefail
        SCRIPT_DIR="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)"
        exec dotnet "$SCRIPT_DIR/Server.dll" "$@"
        EOF

        chmod +x output/Server/Linux/Server.sh

    - name: Package files
      run: |
        sed -i "s/<name>\(.*\)<\/name>\$/<name>\1 [Continuous $SHORT_SHA]<\/name>/" About/About.xml
        mkdir -p output/Multiplayer
        mv About/ Assemblies/ AssembliesCustom/ Defs/ Languages/ Textures/ output/Multiplayer
        cd output/
        zip -r ../Multiplayer-beta.zip Multiplayer/
        zip -r ../Server-beta.zip Server/
        cd ../

    - name: Upload Mod Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Multiplayer-beta
        path: output/
    
    # One release per commit, so builds of different commits can coexist and be
    # compared. Both sides of a session must run the same build; the tag, title and
    # notes all name the commit so the running build can be matched against the
    # "Multiplayer version 0.11.5+<hash>" line each client logs at startup.
    - name: Compose release notes
      run: |
        {
          echo "**Commit:** \`${{ github.sha }}\`"
          echo ""
          echo "**Subject:** $COMMIT_SUBJECT"
          echo ""
          echo "**Branch:** \`${{ github.ref_name }}\`"
          echo ""
          echo "In-game this build reports \`Multiplayer version 0.11.5+$SHORT_SHA\`."
          echo ""
          echo "---"
          echo ""
          cat .github/workflows/alpha-notes.md
        } > release-notes.md

    # Re-running the workflow for the same commit replaces that commit's release
    # and leaves every other commit's release untouched.
    - name: Clean up previous release for this commit
      continue-on-error: true
      run: |
        gh release delete --cleanup-tag --yes "continuous-$SHORT_SHA"

    - name: Upload new release
      run: |
        gh release create --target "${{ github.sha }}" --title "Continuous $SHORT_SHA — $COMMIT_SUBJECT" --notes-file "release-notes.md" --draft "continuous-$SHORT_SHA"
        gh release upload "continuous-$SHORT_SHA" Multiplayer-beta.zip Server-beta.zip
        gh release edit "continuous-$SHORT_SHA" --draft=false
